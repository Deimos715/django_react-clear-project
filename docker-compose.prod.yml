version: "3.9"

services:
  backend_prod:
    image: ghcr.io/deimos715/yuor_repository-backend:latest # репозиторий (backend image из CI/CD)
    container_name: django_prod # изменить для другого проекта
    command: >
      sh -c "python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - backend_staticfiles:/app/staticfiles # статика Django
      - backend_media:/app/media # медиа Django
    ports:
      - "127.0.0.1:8001:8000" # внешний Nginx (FastPanel) проксирует на этот порт (если два сайта и более, указываем порт по порядку 8002,...)
    env_file:
      - ./backend/core/settings/.env.prod # рекомендуется указывать .env.prod
    depends_on:
      db_prod:
        condition: service_healthy
    mem_limit: 512m
    memswap_limit: 512m

  frontend_prod:
    image: ghcr.io/deimos715/yuor_repository-frontend:latest  # репозиторий (frontend image из CI/CD)
    container_name: react_prod # изменить для другого проекта
    ports:
      - "127.0.0.1:3000:80" # наружный порт/внутренний порт (наружу только localhost)
    depends_on:
      - backend_prod
    mem_limit: 256m
    memswap_limit: 256m

  db_prod:
    image: postgres:17
    container_name: postgres_prod # изменить postgres_prod для другого проекта
    env_file:
      - ./backend/core/settings/.env.prod # рекомендуется указывать .env.prod
    ports:
      - "127.0.0.1:5440:5432" # наружный порт/внутренний порт (наружу только localhost)
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data # изменить postgres_prod_data для другого проекта
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    memswap_limit: 384m

volumes:
  postgres_prod_data: # изменить postgres_prod_data для другого проекта
  backend_staticfiles: # изменить backend_staticfiles для другого проекта
  backend_media: # изменить backend_media для другого проекта